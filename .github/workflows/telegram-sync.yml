name: Import Telegram vacancies

on:
  schedule:
    - cron: '17 * * * *' # every hour (GitHub may start it a few minutes late)
  workflow_dispatch: # "Run workflow" button for a manual import

permissions:
  contents: write

concurrency:
  group: telegram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read new channel posts
        run: npm run telegram:sync
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNELS: ${{ vars.TELEGRAM_CHANNELS }}
      - name: Publish to the website
        run: |
          git add public/data/telegram-vacancies.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "cargolink-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import Telegram vacancies"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
